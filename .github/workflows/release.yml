name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v3.27.14.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Plugin ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine tag and version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Package print-my-blog.zip
        run: |
          STAGE_DIR="$(mktemp -d)/print-my-blog"
          mkdir -p "$STAGE_DIR"
          rsync -a --exclude='.git' --exclude='.github' --exclude='tests' --exclude='node_modules' --exclude='dist' ./ "$STAGE_DIR/"
          (cd "$(dirname "$STAGE_DIR")" && zip -r "$GITHUB_WORKSPACE/print-my-blog.zip" print-my-blog)

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" print-my-blog.zip --clobber
          else
            gh release create "$TAG" print-my-blog.zip \
              --title "print-my-blog ${VERSION}" \
              --generate-notes
          fi
