name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v3.27.14.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # The ZIP is CI's build (git archive, see CI.yml), after CI's checks pass.
  ci:
    uses: ./.github/workflows/CI.yml

  release:
    name: Publish Plugin ZIP
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Determine tag and version
        id: meta
        # The tag comes in through env, never pasted into the script: a
        # dispatch input like `v1"; curl … #` would otherwise run as shell.
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+){2,3}$ ]]; then
            echo "::error::Release tag must look like v3.27.18 or v3.27.18.1, got: $TAG"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download CI's build
        uses: actions/download-artifact@v8
        with:
          name: build-artifact
          path: avpvh-print-website

      - name: Package avpvh-print-website.zip
        run: zip -qr avpvh-print-website.zip avpvh-print-website

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" avpvh-print-website.zip --clobber
          else
            gh release create "$TAG" avpvh-print-website.zip \
              --title "avpvh-print-website ${VERSION}" \
              --generate-notes
          fi
