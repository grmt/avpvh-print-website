# Dependabot: weekly, minor and patch updates grouped into one PR per
# ecosystem, major updates as separate PRs (see the shared CLAUDE.md, CI).
version: 2
updates:
- package-ecosystem: github-actions
  directory: "/"
  groups:
    actions:
      update-types: [minor, patch]
  schedule:
    interval: weekly
  assignees:
    - grmt
- package-ecosystem: composer
  directory: "/"
  groups:
    composer:
      update-types: [minor, patch]
  schedule:
    interval: weekly
  assignees:
    - grmt
- package-ecosystem: npm
  directory: "/"
  groups:
    npm:
      update-types: [minor, patch]
  schedule:
    interval: weekly
  assignees:
    - grmt
